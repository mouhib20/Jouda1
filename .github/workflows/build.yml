name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Create project
        run: |
          mkdir -p app/src/main/java/com/jouda/auto app/src/main/res/xml app/src/main/res/values
          echo "" | base64 -d > app/jouda.keystore

          cat > settings.gradle.kts <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "Jouda"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2g
          android.useAndroidX=true
          EOF

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.jouda.auto"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.jouda.auto"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 2
                  versionName = "2.0"
              }
              signingConfigs {
                  create("fixed") {
                      storeFile = file("jouda.keystore")
                      storePassword = "jouda123"
                      keyAlias = "jouda"
                      keyPassword = "jouda123"
                  }
              }
              buildTypes {
                  getByName("debug") { signingConfig = signingConfigs.getByName("fixed") }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <queries>
                  <intent>
                      <action android:name="android.intent.action.MAIN" />
                      <category android:name="android.intent.category.LAUNCHER" />
                  </intent>
              </queries>
              <application
                  android:label="Jouda"
                  android:icon="@android:drawable/ic_menu_search"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.Material.Light">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service
                      android:name=".AutoService"
                      android:exported="true"
                      android:label="Jouda"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_config" />
                  </service>
                  <receiver android:name=".AlarmReceiver" android:exported="false" />
              </application>
          </manifest>
          EOF

          cat > app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="acc_desc">Jouda: البحث التلقائي في تطبيق التوافقات وجمع النتائج</string>
          </resources>
          EOF

          cat > app/src/main/res/xml/accessibility_config.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeAllMask"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagReportViewIds|flagRetrieveInteractiveWindows|flagIncludeNotImportantViews"
              android:canRetrieveWindowContent="true"
              android:canPerformGestures="true"
              android:canTakeScreenshot="true"
              android:notificationTimeout="100"
              android:description="@string/acc_desc" />
          EOF

          cat > app/src/main/java/com/jouda/auto/Store.kt <<'EOF'
          package com.jouda.auto

          import android.content.Context
          import org.json.JSONArray
          import org.json.JSONObject
          import java.io.File

          data class QueueItem(val id: Long, val brand: String, val model: String, var status: String)
          data class ResultItem(val queryId: Long, val query: String, val brand: String, val model: String, val badge: String, val image: String, val aiImage: String = "")

          object Store {
              private val lock = Any()
              private fun p(c: Context) = c.getSharedPreferences("jouda", Context.MODE_PRIVATE)

              fun getStr(c: Context, k: String, d: String): String = p(c).getString(k, d) ?: d
              fun putStr(c: Context, k: String, v: String) { p(c).edit().putString(k, v).apply() }
              fun getInt(c: Context, k: String, d: Int): Int = p(c).getInt(k, d)
              fun putInt(c: Context, k: String, v: Int) { p(c).edit().putInt(k, v).apply() }

              fun getQueue(c: Context): MutableList<QueueItem> {
                  synchronized(lock) {
                      val arr = JSONArray(getStr(c, "queue", "[]"))
                      val out = ArrayList<QueueItem>()
                      for (i in 0 until arr.length()) {
                          val o = arr.getJSONObject(i)
                          out.add(QueueItem(o.getLong("id"), o.getString("brand"), o.getString("model"), o.getString("status")))
                      }
                      return out
                  }
              }

              private fun saveQueue(c: Context, list: List<QueueItem>) {
                  val arr = JSONArray()
                  for (q in list) arr.put(JSONObject().put("id", q.id).put("brand", q.brand).put("model", q.model).put("status", q.status))
                  p(c).edit().putString("queue", arr.toString()).commit()
              }

              fun addItem(c: Context, b: String, m: String) {
                  synchronized(lock) {
                      val l = getQueue(c)
                      l.add(QueueItem(System.currentTimeMillis(), b, m, "pending"))
                      saveQueue(c, l)
                  }
              }

              fun setStatus(c: Context, id: Long, s: String) {
                  synchronized(lock) {
                      val l = getQueue(c)
                      for (q in l) if (q.id == id) q.status = s
                      saveQueue(c, l)
                  }
              }

              fun removeItem(c: Context, id: Long) {
                  synchronized(lock) {
                      val l = getQueue(c)
                      l.removeAll { it.id == id }
                      saveQueue(c, l)
                      removeResultsFor(c, id)
                  }
              }

              fun getResults(c: Context): MutableList<ResultItem> {
                  synchronized(lock) {
                      val arr = JSONArray(getStr(c, "results", "[]"))
                      val out = ArrayList<ResultItem>()
                      for (i in 0 until arr.length()) {
                          val o = arr.getJSONObject(i)
                          out.add(ResultItem(o.getLong("q"), o.getString("query"), o.getString("brand"), o.getString("model"), o.getString("badge"), o.getString("image"), o.optString("ai", "")))
                      }
                      return out
                  }
              }

              private fun saveResults(c: Context, list: List<ResultItem>) {
                  val arr = JSONArray()
                  for (r in list) arr.put(JSONObject().put("q", r.queryId).put("query", r.query).put("brand", r.brand).put("model", r.model).put("badge", r.badge).put("image", r.image).put("ai", r.aiImage))
                  p(c).edit().putString("results", arr.toString()).commit()
              }

              fun addResults(c: Context, list: List<ResultItem>) {
                  synchronized(lock) {
                      val l = getResults(c)
                      l.addAll(list)
                      saveResults(c, l)
                  }
              }

              fun removeResultsFor(c: Context, id: Long) {
                  synchronized(lock) {
                      val l = getResults(c)
                      for (r in l) if (r.queryId == id) {
                          if (r.image.isNotEmpty()) File(r.image).delete()
                          if (r.aiImage.isNotEmpty()) File(r.aiImage).delete()
                      }
                      l.removeAll { it.queryId == id }
                      saveResults(c, l)
                  }
              }

              fun setAi(c: Context, image: String, ai: String) {
                  synchronized(lock) {
                      val l = getResults(c).map { if (it.image == image) it.copy(aiImage = ai) else it }
                      saveResults(c, l)
                  }
              }
          }
          EOF

          cat > app/src/main/java/com/jouda/auto/AlarmReceiver.kt <<'EOF'
          package com.jouda.auto

          import android.app.AlarmManager
          import android.app.PendingIntent
          import android.content.BroadcastReceiver
          import android.content.Context
          import android.content.Intent

          class AlarmReceiver : BroadcastReceiver() {
              override fun onReceive(c: Context, i: Intent) {
                  val s = AutoService.instance
                  if (s != null) s.runBatch() else Store.putStr(c, "log", "الموعد حان لكن خدمة إمكانية الوصول غير مفعّلة")
              }
          }

          object Scheduler {
              private fun pi(c: Context): PendingIntent = PendingIntent.getBroadcast(
                  c, 1, Intent(c, AlarmReceiver::class.java),
                  PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE
              )

              fun enable(c: Context) {
                  val am = c.getSystemService(Context.ALARM_SERVICE) as AlarmManager
                  am.setInexactRepeating(AlarmManager.RTC_WAKEUP, System.currentTimeMillis() + 60_000, AlarmManager.INTERVAL_HOUR, pi(c))
              }

              fun disable(c: Context) {
                  val am = c.getSystemService(Context.ALARM_SERVICE) as AlarmManager
                  am.cancel(pi(c))
              }
          }
          EOF

          cat > app/src/main/java/com/jouda/auto/AutoService.kt <<'EOF'
          package com.jouda.auto

          import android.accessibilityservice.AccessibilityService
          import android.accessibilityservice.GestureDescription
          import android.content.Intent
          import android.graphics.Bitmap
          import android.graphics.Path
          import android.graphics.Rect
          import android.os.Build
          import android.os.Bundle
          import android.view.Display
          import android.view.accessibility.AccessibilityEvent
          import android.view.accessibility.AccessibilityNodeInfo
          import java.io.File
          import java.io.FileOutputStream
          import java.util.concurrent.CountDownLatch
          import java.util.concurrent.TimeUnit

          class LoginRequired : Exception("login")

          class AutoService : AccessibilityService() {

              companion object {
                  @Volatile var instance: AutoService? = null
                  @Volatile var running = false
              }

              override fun onServiceConnected() { super.onServiceConnected(); instance = this }
              override fun onDestroy() { instance = null; super.onDestroy() }
              override fun onAccessibilityEvent(event: AccessibilityEvent?) {}
              override fun onInterrupt() {}

              private fun log(s: String) { Store.putStr(this, "log", s) }

              fun runBatch() {
                  if (running) return
                  running = true
                  Thread {
                      val ctx = this@AutoService
                      var didWork = false
                      try {
                          val size = Store.getInt(ctx, "batch", 3).coerceIn(1, 5)
                          val items = Store.getQueue(ctx).filter { it.status == "pending" || it.status == "error" || it.status == "running" }.take(size)
                          if (items.isEmpty()) log("لا توجد موديلات في الانتظار")
                          for (item in items) {
                              didWork = true
                              Store.setStatus(ctx, item.id, "running")
                              var loginFailed = false
                              val st = try {
                                  process(item)
                              } catch (e: LoginRequired) {
                                  if (doLogin()) {
                                      try { process(item) } catch (e2: Exception) { log("خطأ بعد تسجيل الدخول"); "error" }
                                  } else { loginFailed = true; "error" }
                              } catch (e: Exception) { log("خطأ: " + e.message); "error" }
                              Store.setStatus(ctx, item.id, st)
                              if (loginFailed) {
                                  Scheduler.disable(ctx)
                                  Store.putStr(ctx, "auto", "0")
                                  log(Store.getStr(ctx, "log", "") + " — تم إيقاف البحث التلقائي")
                                  break
                              }
                              Thread.sleep(5000)
                          }
                          if (didWork) { performGlobalAction(AccessibilityService.GLOBAL_ACTION_HOME); didWork = false }
                          if (Store.getStr(ctx, "gemini", "0") == "1") Gemini.enhanceAll(ctx)
                      } catch (e: Exception) {
                          log("خطأ: " + e.message)
                      } finally {
                          if (didWork) performGlobalAction(AccessibilityService.GLOBAL_ACTION_HOME)
                          running = false
                      }
                  }.start()
              }

              // ---------- تسجيل الدخول التلقائي ----------

              private fun loginShown(root: AccessibilityNodeInfo): Boolean =
                  allNodes(root).any { val t = label(it); t.contains("تسجيل الدخول مرة أخرى") || t.contains("نسيت كلمة المرور") }

              private fun top(n: AccessibilityNodeInfo): Int { val r = Rect(); n.getBoundsInScreen(r); return r.top }

              private fun setText(n: AccessibilityNodeInfo, text: String) {
                  n.performAction(AccessibilityNodeInfo.ACTION_CLICK)
                  Thread.sleep(400)
                  val args = Bundle()
                  args.putCharSequence(AccessibilityNodeInfo.ACTION_ARGUMENT_SET_TEXT_CHARSEQUENCE, text)
                  n.performAction(AccessibilityNodeInfo.ACTION_SET_TEXT, args)
              }

              private fun doLogin(): Boolean {
                  val phone = Store.getStr(this, "phone", "").trim()
                  val pass = Store.getStr(this, "pass", "")
                  if (phone.isEmpty() || pass.isEmpty()) { log("التطبيق طلب تسجيل الدخول: أدخل الرقم وكلمة السر في إعدادات Jouda"); return false }
                  var root = rootInActiveWindow ?: return false
                  if (allNodes(root).any { label(it).contains("تسجيل الدخول مرة أخرى") }) {
                      val btn = allNodes(root).filter { label(it).trim() == "تسجيل الدخول" }.maxByOrNull { top(it) }
                      if (btn != null) click(btn)
                      Thread.sleep(3000)
                  }
                  waitRaw(15000) { r -> allNodes(r).firstOrNull { label(it).contains("نسيت كلمة المرور") } }
                      ?: run { log("لم تظهر شاشة تسجيل الدخول"); return false }
                  root = rootInActiveWindow ?: return false
                  val edits = allNodes(root).filter { isEdit(it) }.sortedBy { top(it) }
                  if (edits.size < 2) { log("لم أجد خانات الرقم وكلمة السر"); return false }
                  setText(edits[0], phone)
                  Thread.sleep(600)
                  setText(edits[1], pass)
                  Thread.sleep(800)
                  root = rootInActiveWindow ?: return false
                  val btn = allNodes(root).filter { !isEdit(it) && label(it).trim() == "تسجيل الدخول" }.maxByOrNull { top(it) }
                      ?: run { log("لم أجد زر تسجيل الدخول"); return false }
                  click(btn)
                  Thread.sleep(7000)
                  root = rootInActiveWindow ?: return false
                  if (allNodes(root).any { label(it).contains("نسيت كلمة المرور") }) {
                      log("فشل تسجيل الدخول: تحقق من الرقم وكلمة السر")
                      return false
                  }
                  log("تم تسجيل الدخول تلقائياً")
                  return true
              }

              private fun process(item: QueueItem): String {
                  val pkg = Store.getStr(this, "pkg", "")
                  if (pkg.isEmpty()) { log("لم تختر تطبيق التوافقات"); return "error" }
                  val intent = packageManager.getLaunchIntentForPackage(pkg)
                  if (intent == null) { log("لا يمكن فتح التطبيق"); return "error" }
                  intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_ACTIVITY_CLEAR_TASK)
                  startActivity(intent)
                  Thread.sleep(4000)

                  val start = Store.getStr(this, "start", "").trim()
                  if (start.isNotEmpty()) {
                      val n = waitFor(15000) { root -> findText(root, start) } ?: run { log("لم أجد زر: $start"); return "error" }
                      click(n)
                      Thread.sleep(3000)
                  }

                  // الخطوة 1: الماركة
                  waitFor(15000) { root -> findText(root, "الماركة") } ?: run { log("لم تظهر شاشة الماركات"); return "error" }
                  typeInSearch(item.brand)
                  Thread.sleep(2500)
                  val brandNode = waitFor(8000) { root ->
                      allNodes(root).firstOrNull { !isEdit(it) && norm(label(it)) == norm(item.brand) }
                  } ?: run { log("الماركة غير موجودة: " + item.brand); return "notfound" }
                  click(brandNode)
                  Thread.sleep(3000)

                  // الخطوة 2: الموديل
                  waitFor(15000) { root -> findText(root, "الموديل") } ?: run { log("لم تظهر شاشة الموديلات"); return "error" }
                  typeInSearch(item.model)
                  Thread.sleep(2500)
                  val modelNode = waitFor(8000) { root ->
                      allNodes(root).firstOrNull { !isEdit(it) && modelMatches(label(it), item.model) }
                  } ?: run { log("الموديل غير موجود: " + item.model); return "notfound" }
                  click(modelNode)
                  Thread.sleep(4000)

                  // الخطوة 3: النتائج
                  waitFor(20000) { root -> findText(root, "نتائج البحث") } ?: run { log("لم تظهر النتائج"); return "error" }
                  Thread.sleep(2000)
                  Store.removeResultsFor(this, item.id)
                  val results = collectResults(item)
                  Store.addResults(this, results)
                  log(item.brand + " " + item.model + ": " + results.size + " نتيجة")
                  return "done"
              }

              // ---------- أدوات ----------

              private fun norm(s: String) = s.lowercase().replace(Regex("\\s+"), "")
              private fun label(n: AccessibilityNodeInfo): String = (n.text ?: n.contentDescription ?: "").toString()
              private fun isEdit(n: AccessibilityNodeInfo) = n.isEditable || (n.className?.toString()?.contains("EditText") == true)
              private fun isBadge(t: String) = t.contains("توافق") && !t.contains("توافقات")

              private fun allNodes(root: AccessibilityNodeInfo): List<AccessibilityNodeInfo> {
                  val out = ArrayList<AccessibilityNodeInfo>()
                  fun walk(n: AccessibilityNodeInfo?, d: Int) {
                      if (n == null || d > 60) return
                      out.add(n)
                      for (i in 0 until n.childCount) walk(n.getChild(i), d + 1)
                  }
                  walk(root, 0)
                  return out
              }

              private fun findText(root: AccessibilityNodeInfo, t: String): AccessibilityNodeInfo? =
                  allNodes(root).firstOrNull { !isEdit(it) && label(it).contains(t, ignoreCase = true) }

              private fun waitFor(ms: Long, f: (AccessibilityNodeInfo) -> AccessibilityNodeInfo?): AccessibilityNodeInfo? {
                  val end = System.currentTimeMillis() + ms
                  while (System.currentTimeMillis() < end) {
                      val root = rootInActiveWindow
                      if (root != null) {
                          if (loginShown(root)) throw LoginRequired()
                          val r = f(root)
                          if (r != null) return r
                      }
                      Thread.sleep(500)
                  }
                  return null
              }

              private fun waitRaw(ms: Long, f: (AccessibilityNodeInfo) -> AccessibilityNodeInfo?): AccessibilityNodeInfo? {
                  val end = System.currentTimeMillis() + ms
                  while (System.currentTimeMillis() < end) {
                      val root = rootInActiveWindow
                      if (root != null) {
                          val r = f(root)
                          if (r != null) return r
                      }
                      Thread.sleep(500)
                  }
                  return null
              }

              private fun modelMatches(text: String, query: String): Boolean {
                  val q = norm(query).replace("galaxy", "")
                  if (q.isEmpty()) return false
                  val low = text.lowercase()
                  val firstLine = low.substringBefore("(").lines().firstOrNull { it.isNotBlank() } ?: ""
                  val name = norm(firstLine).replace("galaxy", "")
                  if (name == q) return true
                  if (low.contains("(")) {
                      val code = norm(low.substringAfter("(").substringBefore(")"))
                      if (code == q) return true
                      if (q.startsWith("sm") && code.startsWith(q)) return true
                  }
                  return false
              }

              private fun typeInSearch(text: String): Boolean {
                  val root = rootInActiveWindow ?: return false
                  val et = allNodes(root).firstOrNull { isEdit(it) } ?: return false
                  et.performAction(AccessibilityNodeInfo.ACTION_CLICK)
                  Thread.sleep(500)
                  val args = Bundle()
                  args.putCharSequence(AccessibilityNodeInfo.ACTION_ARGUMENT_SET_TEXT_CHARSEQUENCE, text)
                  return et.performAction(AccessibilityNodeInfo.ACTION_SET_TEXT, args)
              }

              private fun click(node: AccessibilityNodeInfo) {
                  var n: AccessibilityNodeInfo? = node
                  while (n != null && !n.isClickable) n = n.parent
                  if (n != null && n.performAction(AccessibilityNodeInfo.ACTION_CLICK)) return
                  val r = Rect()
                  node.getBoundsInScreen(r)
                  tap(r.exactCenterX(), r.exactCenterY())
              }

              private fun tap(x: Float, y: Float) {
                  val p = Path()
                  p.moveTo(x, y)
                  dispatchGesture(GestureDescription.Builder().addStroke(GestureDescription.StrokeDescription(p, 0, 80)).build(), null, null)
              }

              private fun swipeUp() {
                  val h = resources.displayMetrics.heightPixels.toFloat()
                  val w = resources.displayMetrics.widthPixels / 2f
                  val p = Path()
                  p.moveTo(w, h * 0.75f)
                  p.lineTo(w, h * 0.35f)
                  dispatchGesture(GestureDescription.Builder().addStroke(GestureDescription.StrokeDescription(p, 0, 400)).build(), null, null)
              }

              private fun screenshot(): Bitmap? {
                  if (Build.VERSION.SDK_INT < Build.VERSION_CODES.R) return null
                  var bmp: Bitmap? = null
                  val latch = CountDownLatch(1)
                  takeScreenshot(Display.DEFAULT_DISPLAY, mainExecutor, object : AccessibilityService.TakeScreenshotCallback {
                      override fun onSuccess(result: AccessibilityService.ScreenshotResult) {
                          try {
                              val hw = Bitmap.wrapHardwareBuffer(result.hardwareBuffer, result.colorSpace)
                              bmp = hw?.copy(Bitmap.Config.ARGB_8888, false)
                              result.hardwareBuffer.close()
                          } catch (e: Exception) {}
                          latch.countDown()
                      }
                      override fun onFailure(errorCode: Int) { latch.countDown() }
                  })
                  latch.await(5, TimeUnit.SECONDS)
                  return bmp
              }

              private fun findCards(nodes: List<AccessibilityNodeInfo>): List<AccessibilityNodeInfo> {
                  val cards = ArrayList<AccessibilityNodeInfo>()
                  val seen = HashSet<String>()
                  for (n in nodes) {
                      if (!label(n).lines().any { isBadge(it.trim()) }) continue
                      var c: AccessibilityNodeInfo? = n
                      var depth = 0
                      while (c != null && depth < 6 && allNodes(c).none { label(it).contains("(") }) { c = c.parent; depth++ }
                      if (c == null) continue
                      val r = Rect()
                      c.getBoundsInScreen(r)
                      if (seen.add(r.toShortString())) cards.add(c)
                  }
                  return cards
              }

              private fun collectResults(item: QueueItem): List<ResultItem> {
                  val found = LinkedHashMap<String, ResultItem>()
                  val later = LinkedHashMap<String, ResultItem>()
                  val dir = File(filesDir, "images")
                  dir.mkdirs()
                  val query = item.brand + " " + item.model
                  var noNew = 0
                  var loops = 0
                  while (loops < 40 && noNew < 2) {
                      loops++
                      val root = rootInActiveWindow ?: break
                      if (loginShown(root)) throw LoginRequired()
                      val shot = screenshot()
                      val nodes = allNodes(root)
                      val scroller = nodes.filter { it.isScrollable }.maxByOrNull { val r = Rect(); it.getBoundsInScreen(r); r.height() }
                      val box = Rect()
                      scroller?.getBoundsInScreen(box)
                      var added = 0
                      for (card in findCards(nodes)) {
                          val lines = allNodes(card).map { label(it) }.flatMap { it.lines() }.map { it.trim() }.filter { it.isNotEmpty() }.distinct()
                          val idx = lines.indexOfFirst { it.contains("(") }
                          if (idx < 0) continue
                          var model = lines[idx]
                          if (model.startsWith("(") && idx > 0) model = lines[idx - 1] + " " + model
                          val badge = lines.firstOrNull { isBadge(it) } ?: ""
                          val brand = lines.firstOrNull { l -> !l.contains("(") && !isBadge(l) && l == l.uppercase() && l.any { ch -> ch in 'A'..'Z' } } ?: ""
                          val key = norm(model)
                          if (found.containsKey(key)) continue
                          val r = Rect()
                          card.getBoundsInScreen(r)
                          val clipped = scroller != null && (r.top <= box.top + 3 || r.bottom >= box.bottom - 3)
                          if (clipped) {
                              if (!later.containsKey(key)) later[key] = ResultItem(item.id, query, brand, model, badge, "")
                              continue
                          }
                          var img = ""
                          if (shot != null && r.width() > 50 && r.height() > 50 && r.left >= 0 && r.top >= 0 && r.right <= shot.width && r.bottom <= shot.height) {
                              try {
                                  val crop = Bitmap.createBitmap(shot, r.left, r.top, r.width(), r.height())
                                  val f = File(dir, item.id.toString() + "_" + found.size + ".jpg")
                                  FileOutputStream(f).use { crop.compress(Bitmap.CompressFormat.JPEG, 85, it) }
                                  img = f.absolutePath
                              } catch (e: Exception) {}
                          }
                          found[key] = ResultItem(item.id, query, brand, model, badge, img)
                          added++
                      }
                      if (added == 0) noNew++ else noNew = 0
                      val scrolled = scroller?.performAction(AccessibilityNodeInfo.ACTION_SCROLL_FORWARD) ?: false
                      if (!scrolled) swipeUp()
                      Thread.sleep(2000)
                  }
                  for ((k, v) in later) if (!found.containsKey(k)) found[k] = v
                  return found.values.toList()
              }
          }
          EOF

          cat > app/src/main/java/com/jouda/auto/Gemini.kt <<'EOF'
          package com.jouda.auto

          import android.content.Context
          import android.util.Base64
          import org.json.JSONArray
          import org.json.JSONObject
          import java.io.File
          import java.net.HttpURLConnection
          import java.net.URL

          object Gemini {
              @Volatile var busy = false

              fun enhance(c: Context, r: ResultItem): String? {
                  val key = Store.getStr(c, "gkey", "").trim()
                  if (key.isEmpty()) { Store.putStr(c, "log", "Gemini: أدخل المفتاح في الإعدادات"); return null }
                  val model = Store.getStr(c, "gmodel", "gemini-3.1-flash-image").trim().ifEmpty { "gemini-3.1-flash-image" }
                  val src = File(r.image)
                  if (!src.exists()) return null
                  val b64 = Base64.encodeToString(src.readBytes(), Base64.NO_WRAP)
                  val name = (r.brand + " " + r.model).trim()
                  val prompt = "This is a cropped screenshot of a listing card showing the phone " + name +
                      ". Produce a clean, high quality product photo of exactly this phone: remove the card border, badges, labels and all text, " +
                      "place the phone centered on a pure white background, sharper and better lit. " +
                      "Do NOT change the phone design, camera layout, colors, buttons or proportions."
                  val body = JSONObject()
                      .put("contents", JSONArray().put(JSONObject().put("parts", JSONArray()
                          .put(JSONObject().put("text", prompt))
                          .put(JSONObject().put("inline_data", JSONObject().put("mime_type", "image/jpeg").put("data", b64))))))
                      .put("generationConfig", JSONObject().put("responseModalities", JSONArray().put("IMAGE")))
                  val con = URL("https://generativelanguage.googleapis.com/v1beta/models/" + model + ":generateContent").openConnection() as HttpURLConnection
                  con.requestMethod = "POST"
                  con.doOutput = true
                  con.connectTimeout = 30000
                  con.readTimeout = 180000
                  con.setRequestProperty("Content-Type", "application/json")
                  con.setRequestProperty("x-goog-api-key", key)
                  con.outputStream.use { it.write(body.toString().toByteArray()) }
                  val code = con.responseCode
                  val stream = if (code in 200..299) con.inputStream else con.errorStream
                  val text = stream?.bufferedReader()?.use { it.readText() } ?: ""
                  if (code !in 200..299) { Store.putStr(c, "log", "Gemini خطأ " + code + ": " + text.take(200)); return null }
                  val parts = JSONObject(text).optJSONArray("candidates")?.optJSONObject(0)?.optJSONObject("content")?.optJSONArray("parts") ?: return null
                  for (i in 0 until parts.length()) {
                      val p = parts.getJSONObject(i)
                      val d = p.optJSONObject("inlineData") ?: p.optJSONObject("inline_data") ?: continue
                      val out = File(r.image.substringBeforeLast(".") + "_ai.png")
                      out.writeBytes(Base64.decode(d.getString("data"), Base64.DEFAULT))
                      return out.absolutePath
                  }
                  return null
              }

              fun enhanceAll(c: Context) {
                  if (busy) return
                  busy = true
                  try {
                      val todo = Store.getResults(c).filter { it.image.isNotEmpty() && it.aiImage.isEmpty() }
                      var ok = 0
                      for (r in todo) {
                          val path = try { enhance(c, r) } catch (e: Exception) { Store.putStr(c, "log", "Gemini: " + e.message); null }
                          if (path != null) { Store.setAi(c, r.image, path); ok++ }
                          Thread.sleep(1500)
                      }
                      if (todo.isNotEmpty()) Store.putStr(c, "log", "Gemini: تم تحسين " + ok + " من " + todo.size + " صورة")
                  } finally {
                      busy = false
                  }
              }
          }
          EOF

          cat > app/src/main/java/com/jouda/auto/MainActivity.kt <<'EOF'
          package com.jouda.auto

          import android.app.Activity
          import android.app.AlertDialog
          import android.content.Intent
          import android.graphics.BitmapFactory
          import android.provider.Settings
          import android.text.InputType
          import android.widget.Button
          import android.widget.EditText
          import android.widget.ImageView
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.TextView
          import android.widget.Toast
          import java.io.File

          class MainActivity : Activity() {
              private lateinit var box: LinearLayout

              override fun onResume() {
                  super.onResume()
                  build()
              }

              private fun build() {
                  val sv = ScrollView(this)
                  box = LinearLayout(this)
                  box.orientation = LinearLayout.VERTICAL
                  box.setPadding(32, 32, 32, 32)
                  sv.addView(box)
                  setContentView(sv)

                  title("Jouda - البحث التلقائي")
                  text(if (AutoService.instance != null) "✓ خدمة إمكانية الوصول مفعّلة" else "✗ خدمة إمكانية الوصول غير مفعّلة")
                  button("1) تفعيل الخدمة") { startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS)) }

                  val pkg = Store.getStr(this, "pkg", "")
                  text("تطبيق التوافقات: " + (if (pkg.isEmpty()) "لم يُختر بعد" else appName(pkg)))
                  button("2) اختيار تطبيق التوافقات") { pickApp() }

                  text("زر قبل شاشة الماركات (اختياري، اتركه فارغاً إن كانت الماركات أول شاشة):")
                  val startEt = edit(Store.getStr(this, "start", ""), "مثال: توافقات شاشات")
                  text("عدد الموديلات في كل ساعة (1 إلى 5):")
                  val batchEt = edit(Store.getInt(this, "batch", 3).toString(), "3")
                  batchEt.inputType = InputType.TYPE_CLASS_NUMBER
                  text("حساب تطبيق التوافقات (للدخول التلقائي عند الخروج من الحساب):")
                  val phoneEt = edit(Store.getStr(this, "phone", ""), "رقم الهاتف")
                  phoneEt.inputType = InputType.TYPE_CLASS_PHONE
                  val passEt = edit(Store.getStr(this, "pass", ""), "كلمة المرور")
                  passEt.inputType = InputType.TYPE_CLASS_TEXT or InputType.TYPE_TEXT_VARIATION_PASSWORD
                  text("Gemini (اختياري لتحسين الصور):")
                  val keyEt = edit(Store.getStr(this, "gkey", ""), "مفتاح Gemini API")
                  keyEt.inputType = InputType.TYPE_CLASS_TEXT or InputType.TYPE_TEXT_VARIATION_PASSWORD
                  val modelEt = edit(Store.getStr(this, "gmodel", "gemini-3.1-flash-image"), "اسم النموذج")
                  button("حفظ الإعدادات") {
                      Store.putStr(this, "start", startEt.text.toString().trim())
                      Store.putInt(this, "batch", (batchEt.text.toString().toIntOrNull() ?: 3).coerceIn(1, 5))
                      Store.putStr(this, "phone", phoneEt.text.toString().trim())
                      Store.putStr(this, "pass", passEt.text.toString())
                      Store.putStr(this, "gkey", keyEt.text.toString().trim())
                      Store.putStr(this, "gmodel", modelEt.text.toString().trim())
                      toast("تم الحفظ")
                  }
                  val gOn = Store.getStr(this, "gemini", "0") == "1"
                  button(if (gOn) "✨ تحسين تلقائي بعد كل دورة: مفعّل (اضغط للإيقاف)" else "✨ تحسين تلقائي بعد كل دورة: متوقف (اضغط للتشغيل)") {
                      Store.putStr(this, "gemini", if (gOn) "0" else "1")
                      build()
                  }
                  button("✨ تحسين الصور الحالية الآن") {
                      if (Gemini.busy) toast("التحسين يعمل بالفعل")
                      else { val app = applicationContext; Thread { Gemini.enhanceAll(app) }.start(); toast("بدأ التحسين، اضغط تحديث بعد قليل") }
                  }

                  title("إضافة موديل")
                  val brandEt = edit("", "الماركة، مثل Samsung")
                  val modelEt = edit("", "الموديل، مثل A02S")
                  button("إضافة إلى القائمة") {
                      val b = brandEt.text.toString().trim()
                      val m = modelEt.text.toString().trim()
                      if (b.isNotEmpty() && m.isNotEmpty()) { Store.addItem(this, b, m); build() } else toast("اكتب الماركة والموديل")
                  }

                  title("التشغيل")
                  val auto = Store.getStr(this, "auto", "0") == "1"
                  button(if (auto) "⏸ إيقاف البحث كل ساعة" else "▶ تشغيل البحث كل ساعة") {
                      if (auto) { Scheduler.disable(this); Store.putStr(this, "auto", "0") }
                      else { Scheduler.enable(this); Store.putStr(this, "auto", "1"); toast("أول دورة بعد دقيقة تقريباً") }
                      build()
                  }
                  button("تشغيل الآن") {
                      val s = AutoService.instance
                      if (s == null) toast("فعّل الخدمة أولاً") else { s.runBatch(); toast("بدأ البحث") }
                  }
                  text("آخر حالة: " + Store.getStr(this, "log", "-"))
                  button("تحديث الشاشة") { build() }

                  title("القائمة والنتائج (اضغط على موديل للخيارات)")
                  val results = Store.getResults(this)
                  for (q in Store.getQueue(this)) {
                      val st = when (q.status) {
                          "pending" -> "⏳"
                          "done" -> "✓"
                          "notfound" -> "✗ غير موجود"
                          "running" -> "🔄"
                          else -> "⚠ خطأ"
                      }
                      val tv = text(st + "  " + q.brand + " " + q.model)
                      tv.textSize = 17f
                      tv.setOnClickListener { itemMenu(q) }
                      if (q.status == "done") for (r in results.filter { it.queryId == q.id }) resultRow(r)
                  }
              }

              private fun resultRow(r: ResultItem) {
                  val row = LinearLayout(this)
                  row.orientation = LinearLayout.HORIZONTAL
                  row.setPadding(24, 8, 0, 8)
                  for (path in listOf(r.image, r.aiImage)) {
                      if (path.isNotEmpty() && File(path).exists()) {
                          val opts = BitmapFactory.Options()
                          opts.inSampleSize = 3
                          val iv = ImageView(this)
                          iv.setImageBitmap(BitmapFactory.decodeFile(path, opts))
                          row.addView(iv, LinearLayout.LayoutParams(200, 200))
                      }
                  }
                  val tv = TextView(this)
                  tv.text = r.badge + "\n" + r.brand + " " + r.model
                  tv.setPadding(16, 0, 16, 0)
                  row.addView(tv)
                  box.addView(row)
              }

              private fun itemMenu(q: QueueItem) {
                  AlertDialog.Builder(this)
                      .setTitle(q.brand + " " + q.model)
                      .setItems(arrayOf("إعادة البحث", "حذف")) { _, w ->
                          if (w == 0) Store.setStatus(this, q.id, "pending") else Store.removeItem(this, q.id)
                          build()
                      }.show()
              }

              private fun pickApp() {
                  val i = Intent(Intent.ACTION_MAIN).addCategory(Intent.CATEGORY_LAUNCHER)
                  val apps = packageManager.queryIntentActivities(i, 0)
                      .map { it.loadLabel(packageManager).toString() to it.activityInfo.packageName }
                      .sortedBy { it.first }
                  AlertDialog.Builder(this)
                      .setTitle("اختر تطبيق التوافقات")
                      .setItems(apps.map { it.first }.toTypedArray()) { _, w ->
                          Store.putStr(this, "pkg", apps[w].second)
                          build()
                      }.show()
              }

              private fun appName(pkg: String): String = try {
                  packageManager.getApplicationLabel(packageManager.getApplicationInfo(pkg, 0)).toString()
              } catch (e: Exception) { pkg }

              private fun title(s: String): TextView {
                  val t = TextView(this); t.text = s; t.textSize = 20f; t.setPadding(0, 32, 0, 8); box.addView(t); return t
              }
              private fun text(s: String): TextView {
                  val t = TextView(this); t.text = s; t.textSize = 15f; t.setPadding(0, 8, 0, 8); box.addView(t); return t
              }
              private fun button(s: String, f: () -> Unit): Button {
                  val b = Button(this); b.text = s; b.setOnClickListener { f() }; box.addView(b); return b
              }
              private fun edit(v: String, h: String): EditText {
                  val e = EditText(this); e.setText(v); e.hint = h; box.addView(e); return e
              }
              private fun toast(s: String) = Toast.makeText(this, s, Toast.LENGTH_SHORT).show()
          }
          EOF

